[package]
name = "border-collie"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
description = "Herdr plugin that keeps spaces sorted by recent use and names tabs and agents after their work"
license = "MIT"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
