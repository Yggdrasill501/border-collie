id = "collie"
name = "Collie"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Keeps spaces sorted by most recently used and names tabs after their agents"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[startup]]
command = ["target/release/collie", "startup"]

# Spaces: move the focused space to the top once it has stayed focused.
[[events]]
on = "workspace.focused"
command = ["target/release/collie", "focused"]

# Tabs: rename after the most recently active agent in the tab.
[[events]]
on = "pane.agent_status_changed"
command = ["target/release/collie", "name"]

[[events]]
on = "pane.agent_detected"
command = ["target/release/collie", "name"]

[[events]]
on = "pane.closed"
command = ["target/release/collie", "name"]

[[events]]
on = "pane.moved"
command = ["target/release/collie", "name"]

[[actions]]
id = "name-tabs"
title = "Rename tabs after their agents"
contexts = ["workspace"]
command = ["target/release/collie", "name"]
